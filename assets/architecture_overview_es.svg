<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accents & Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e25a1c" />
      <stop offset="100%" stop-color="#ff3621" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff9900" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="700" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="800" y1="0" x2="800" y2="700" />
    <line x1="1000" y1="0" x2="1000" y2="700" />
  </g>

  <!-- ========================================================================= -->
  <!-- HEADER SECTION (ESPAÑOL)                                                  -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 40)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#38bdf8" />
    <text x="24" y="16" class="tag-text" fill="#38bdf8">ARQUITECTURA SPRINT 1</text>

    <!-- Main Title -->
    <text x="0" y="52" class="title" font-size="24">Lakehouse Serverless &amp; Plataforma DataOps Productiva</text>
    <text x="0" y="74" class="subtitle">Fundamentos Cloud AWS • PySpark Catalyst Internals • Delta Lake ACID • Orquestación con Docker Compose</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 1: INGESTA & SINCRONIZACIÓN                                         -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 145)" filter="url(#cardShadow)">
    <rect width="240" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="240" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="20" y="32" class="card-title">1. INGESTA &amp; SYNC</text>
    <text x="20" y="48" class="card-subtitle">Generación Batch y Automatización Local</text>

    <!-- Box 1.1 -->
    <g transform="translate(15, 65)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Ingesta Sintética</text>
      <text x="12" y="42" class="code-text">100,000+ Registros Crudos</text>
      <text x="12" y="58" class="subtitle" font-size="10">E-Commerce, Pagos y Logística</text>
    </g>

    <!-- Box 1.2 -->
    <g transform="translate(15, 148)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Almacén Particionado</text>
      <text x="12" y="42" class="code-text">year=YYYY / month=MM / day=DD</text>
      <text x="12" y="58" class="subtitle" font-size="10">Formato columnar Parquet Snappy</text>
    </g>

    <!-- Box 1.3 -->
    <g transform="translate(15, 230)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Bash Defensivo</text>
      <text x="12" y="42" class="code-text">set -euo pipefail</text>
      <text x="12" y="58" class="subtitle" font-size="10">aws s3 sync idempotente + dryrun</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 290 300 L 330 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- ========================================================================= -->
  <!-- STAGE 2: ALMACENAMIENTO CLOUD & CATÁLOGO AWS                              -->
  <!-- ========================================================================= -->
  <g transform="translate(340, 145)" filter="url(#cardShadow)">
    <rect width="240" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="240" height="4" rx="2" fill="url(#orangeGrad)" />

    <text x="20" y="32" class="card-title">2. ALMACENAMIENTO &amp; CATÁLOGO</text>
    <text x="20" y="48" class="card-subtitle">Metadatos Centralizados Serverless</text>

    <!-- Box 2.1 -->
    <g transform="translate(15, 65)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff9900">Amazon S3 Lakehouse</text>
      <text x="12" y="42" class="code-text">s3://kevarci-lakehouse/</text>
      <text x="12" y="58" class="subtitle" font-size="10">Capas Bronze (Cruda) y Silver</text>
    </g>

    <!-- Box 2.2 -->
    <g transform="translate(15, 148)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff9900">AWS Glue Data Catalog</text>
      <text x="12" y="42" class="code-text">db_mastery_lakehouse</text>
      <text x="12" y="58" class="subtitle" font-size="10">Descubrimiento de Esquemas</text>
    </g>

    <!-- Box 2.3 -->
    <g transform="translate(15, 230)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff9900">Partition Projection</text>
      <text x="12" y="42" class="code-text">projection.enabled = true</text>
      <text x="12" y="58" class="subtitle" font-size="10">Consultas sin rastreo de Crawler</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 580 300 L 620 300" stroke="#ff9900" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowOrange)" />

  <!-- ========================================================================= -->
  <!-- STAGE 3: MOTOR PYSPARK & DELTA LAKE                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(630, 145)" filter="url(#cardShadow)">
    <rect width="250" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="4" rx="2" fill="url(#sparkGrad)" />

    <text x="20" y="32" class="card-title">3. PYSPARK &amp; DELTA LAKE</text>
    <text x="20" y="48" class="card-subtitle">Cómputo Distribuido en Databricks</text>

    <!-- Box 3.1 -->
    <g transform="translate(15, 65)">
      <rect width="220" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff3621">Optimizador Catalyst CBO</text>
      <text x="12" y="42" class="code-text">Parsed → Analyzed → Physical</text>
      <text x="12" y="58" class="subtitle" font-size="10">Ejecución Estrecha vs Ancha (Shuffle)</text>
    </g>

    <!-- Box 3.2 -->
    <g transform="translate(15, 148)">
      <rect width="220" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff3621">Broadcast &amp; Salting</text>
      <text x="12" y="42" class="code-text">broadcast(dim_df)</text>
      <text x="12" y="58" class="subtitle" font-size="10">Mitiga Skew y Cuellos de Red</text>
    </g>

    <!-- Box 3.3 -->
    <g transform="translate(15, 230)">
      <rect width="220" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#10b981">Delta Lake ACID (Capa Gold)</text>
      <text x="12" y="42" class="code-text">MERGE INTO &amp; Time Travel</text>
      <text x="12" y="58" class="subtitle" font-size="10">Upserts Atómicos + Optimización Z-Order</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 880 300 L 920 300" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />

  <!-- ========================================================================= -->
  <!-- STAGE 4: SERVICIO ANALÍTICO & QUERIES                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(930, 145)" filter="url(#cardShadow)">
    <rect width="220" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="220" height="4" rx="2" fill="url(#purpleGrad)" />

    <text x="20" y="32" class="card-title">4. SERVICIO &amp; ANALÍTICA</text>
    <text x="20" y="48" class="card-subtitle">Consumo Serverless de Alta Velocidad</text>

    <!-- Box 4.1 -->
    <g transform="translate(15, 65)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#a855f7">Amazon Athena (Trino)</text>
      <text x="12" y="42" class="code-text">SQL ANSI Serverless</text>
      <text x="12" y="58" class="subtitle" font-size="10">Cero clústeres ociosos que pagar</text>
    </g>

    <!-- Box 4.2 -->
    <g transform="translate(15, 148)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#38bdf8">Partition Pruning</text>
      <text x="12" y="42" class="code-text">99.4% Escaneo Ahorrado</text>
      <text x="12" y="58" class="subtitle" font-size="10">2.6 MB vs 420 MB en escaneo total</text>
    </g>

    <!-- Box 4.3 -->
    <g transform="translate(15, 230)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Acceso BI &amp; Power BI</text>
      <text x="12" y="42" class="code-text">DirectQuery / JDBC</text>
      <text x="12" y="58" class="subtitle" font-size="10">Marts Gold y KPIs Ejecutivos</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM SECTION: DOS DRILLS TÉCNICOS                                       -->
  <!-- ========================================================================= -->

  <!-- Drill Left: SQL Engine Performance Tuning -->
  <g transform="translate(50, 490)" filter="url(#cardShadow)">
    <rect width="530" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="530" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="25" y="30" class="card-title">⚡ DRILL TÉCNICO: INTERNALS Y TUNING DE MOTORES SQL</text>
    <text x="25" y="46" class="card-subtitle">Planes de Ejecución en 120,000+ filas • DBeaver • SQLite &amp; T-SQL</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#38bdf8">Index Seek vs. Table Scan</text>
      <text x="12" y="42" class="subtitle" font-size="11">SCAN (120k filas) → SEARCH B-Tree</text>
      <text x="12" y="60" class="code-text">O(N) Lineal → O(log N) Logarítmico</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">Índices cubrientes (INCLUDE) &amp; Filtrados</text>
    </g>

    <g transform="translate(275, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#f59e0b">Joins Físicos &amp; Spills a TempDB</text>
      <text x="12" y="42" class="subtitle" font-size="11">Nested Loops vs Merge vs Hash Match</text>
      <text x="12" y="60" class="code-text">Prevención Desborde Memoria RAM</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">DENSE_RANK() &amp; Upsert (ON CONFLICT)</text>
    </g>
  </g>

  <!-- Drill Right: Docker Compose Multi-Container -->
  <g transform="translate(620, 490)" filter="url(#cardShadow)">
    <rect width="530" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="530" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="25" y="30" class="card-title">🐳 DRILL TÉCNICO: DATAOPS MULTI-CONTENEDOR (COMPOSE)</text>
    <text x="25" y="46" class="card-subtitle">Arquitectura Aislada en Red Bridge • Healthchecks • Persistencia Host</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#0ea5e9">Red Virtual &amp; DNS Interno</text>
      <text x="12" y="42" class="subtitle" font-size="11">Cero localhost • Switch Virtual Bridge</text>
      <text x="12" y="60" class="code-text">host: postgres_db:5432</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">PostgreSQL 16 Alpine + Python 3.12</text>
    </g>

    <g transform="translate(275, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#10b981">Resiliencia &amp; Bind Mounts</text>
      <text x="12" y="42" class="subtitle" font-size="11">condition: service_healthy (pg_isready)</text>
      <text x="12" y="60" class="code-text">./data/output:/app/data/output</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">Cero race condition • Persistencia en Windows</text>
    </g>
  </g>

</svg>
