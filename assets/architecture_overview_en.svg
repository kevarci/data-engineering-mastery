<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accents & Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e25a1c" />
      <stop offset="100%" stop-color="#ff3621" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff9900" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="700" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="800" y1="0" x2="800" y2="700" />
    <line x1="1000" y1="0" x2="1000" y2="700" />
  </g>

  <!-- ========================================================================= -->
  <!-- HEADER SECTION (ENGLISH)                                                  -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 40)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#38bdf8" />
    <text x="24" y="16" class="tag-text" fill="#38bdf8">SPRINT 1 ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="52" class="title" font-size="24">Serverless Lakehouse &amp; Production DataOps Platform</text>
    <text x="0" y="74" class="subtitle">AWS Cloud Foundations • PySpark Catalyst Internals • Delta Lake ACID • Docker Compose Orchestration</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 1: INGESTION & LOCAL AUTOMATION                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 145)" filter="url(#cardShadow)">
    <rect width="240" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="240" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="20" y="32" class="card-title">1. INGESTION &amp; SYNC</text>
    <text x="20" y="48" class="card-subtitle">Batch Generation &amp; Local Automation</text>

    <!-- Box 1.1 -->
    <g transform="translate(15, 65)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Synthetic Ingestion</text>
      <text x="12" y="42" class="code-text">100,000+ Raw Records</text>
      <text x="12" y="58" class="subtitle" font-size="10">E-Commerce, Payments &amp; Logistics</text>
    </g>

    <!-- Box 1.2 -->
    <g transform="translate(15, 148)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Partitioned Storage</text>
      <text x="12" y="42" class="code-text">year=YYYY / month=MM / day=DD</text>
      <text x="12" y="58" class="subtitle" font-size="10">Snappy Parquet columnar format</text>
    </g>

    <!-- Box 1.3 -->
    <g transform="translate(15, 230)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">Defensive Bash Sync</text>
      <text x="12" y="42" class="code-text">set -euo pipefail</text>
      <text x="12" y="58" class="subtitle" font-size="10">Idempotent aws s3 sync + dryrun checks</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 290 300 L 330 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- ========================================================================= -->
  <!-- STAGE 2: AWS STORAGE & METADATA CATALOG                                   -->
  <!-- ========================================================================= -->
  <g transform="translate(340, 145)" filter="url(#cardShadow)">
    <rect width="240" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="240" height="4" rx="2" fill="url(#orangeGrad)" />

    <text x="20" y="32" class="card-title">2. AWS STORAGE &amp; CATALOG</text>
    <text x="20" y="48" class="card-subtitle">Serverless Centralized Metadata</text>

    <!-- Box 2.1 -->
    <g transform="translate(15, 65)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff9900">Amazon S3 Lakehouse</text>
      <text x="12" y="42" class="code-text">s3://kevarci-lakehouse/</text>
      <text x="12" y="58" class="subtitle" font-size="10">Bronze (Raw) &amp; Silver Layers</text>
    </g>

    <!-- Box 2.2 -->
    <g transform="translate(15, 148)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff9900">AWS Glue Data Catalog</text>
      <text x="12" y="42" class="code-text">db_mastery_lakehouse</text>
      <text x="12" y="58" class="subtitle" font-size="10">Automated Schema Discovery</text>
    </g>

    <!-- Box 2.3 -->
    <g transform="translate(15, 230)">
      <rect width="210" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff9900">Partition Projection</text>
      <text x="12" y="42" class="code-text">projection.enabled = true</text>
      <text x="12" y="58" class="subtitle" font-size="10">Zero-crawler metadata queries</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 580 300 L 620 300" stroke="#ff9900" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowOrange)" />

  <!-- ========================================================================= -->
  <!-- STAGE 3: PYSPARK ENGINE & DELTA LAKE                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(630, 145)" filter="url(#cardShadow)">
    <rect width="250" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="4" rx="2" fill="url(#sparkGrad)" />

    <text x="20" y="32" class="card-title">3. PYSPARK &amp; DELTA LAKE</text>
    <text x="20" y="48" class="card-subtitle">Databricks Distributed Processing</text>

    <!-- Box 3.1 -->
    <g transform="translate(15, 65)">
      <rect width="220" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff3621">Catalyst CBO Optimizer</text>
      <text x="12" y="42" class="code-text">Parsed → Analyzed → Physical</text>
      <text x="12" y="58" class="subtitle" font-size="10">Narrow vs. Wide (Shuffle) Execution</text>
    </g>

    <!-- Box 3.2 -->
    <g transform="translate(15, 148)">
      <rect width="220" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#ff3621">Broadcast &amp; Salting</text>
      <text x="12" y="42" class="code-text">broadcast(dim_df)</text>
      <text x="12" y="58" class="subtitle" font-size="10">Mitigates Data Skew &amp; Network Latency</text>
    </g>

    <!-- Box 3.3 -->
    <g transform="translate(15, 230)">
      <rect width="220" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#10b981">Delta Lake ACID (Gold Layer)</text>
      <text x="12" y="42" class="code-text">MERGE INTO &amp; Time Travel</text>
      <text x="12" y="58" class="subtitle" font-size="10">Idempotent Upserts + Z-Order Compaction</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 880 300 L 920 300" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />

  <!-- ========================================================================= -->
  <!-- STAGE 4: SERVERLESS QUERY SERVING                                         -->
  <!-- ========================================================================= -->
  <g transform="translate(930, 145)" filter="url(#cardShadow)">
    <rect width="220" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="220" height="4" rx="2" fill="url(#purpleGrad)" />

    <text x="20" y="32" class="card-title">4. SERVING &amp; ANALYTICS</text>
    <text x="20" y="48" class="card-subtitle">Zero-Infra High-Speed Consumption</text>

    <!-- Box 4.1 -->
    <g transform="translate(15, 65)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#a855f7">Amazon Athena (Trino)</text>
      <text x="12" y="42" class="code-text">Serverless ANSI SQL</text>
      <text x="12" y="58" class="subtitle" font-size="10">No clusters to manage or pay idle costs</text>
    </g>

    <!-- Box 4.2 -->
    <g transform="translate(15, 148)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#38bdf8">Partition Pruning</text>
      <text x="12" y="42" class="code-text">99.4% Scanned Saved</text>
      <text x="12" y="58" class="subtitle" font-size="10">2.6 MB read vs 420 MB full table scan</text>
    </g>

    <!-- Box 4.3 -->
    <g transform="translate(15, 230)">
      <rect width="190" height="72" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" class="item-text" font-weight="700" fill="#f8fafc">BI &amp; Analytics Access</text>
      <text x="12" y="42" class="code-text">DirectQuery / JDBC Connector</text>
      <text x="12" y="58" class="subtitle" font-size="10">Gold Marts &amp; Executive KPIs</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM SECTION: TWO TECHNICAL HARD DRILLS                                 -->
  <!-- ========================================================================= -->

  <!-- Drill Left: SQL Engine Performance Tuning -->
  <g transform="translate(50, 490)" filter="url(#cardShadow)">
    <rect width="530" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="530" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="25" y="30" class="card-title">⚡ HARD DRILL: SQL ENGINE INTERNALS &amp; TUNING</text>
    <text x="25" y="46" class="card-subtitle">Execution Plans on 120,000+ rows • DBeaver • SQLite &amp; T-SQL</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#38bdf8">Index Seek vs. Table Scan</text>
      <text x="12" y="42" class="subtitle" font-size="11">SCAN (120k rows) → SEARCH B-Tree</text>
      <text x="12" y="60" class="code-text">O(N) Linear → O(log N) Logarithmic</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">Covering (INCLUDE) &amp; Filtered Indexes</text>
    </g>

    <g transform="translate(275, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#f59e0b">Physical Joins &amp; TempDB Spills</text>
      <text x="12" y="42" class="subtitle" font-size="11">Nested Loops vs Merge vs Hash Match</text>
      <text x="12" y="60" class="code-text">Memory Grant Overflow Prevention</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">DENSE_RANK() &amp; Atomic Upserts (ON CONFLICT)</text>
    </g>
  </g>

  <!-- Drill Right: Docker Compose Multi-Container -->
  <g transform="translate(620, 490)" filter="url(#cardShadow)">
    <rect width="530" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="530" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="25" y="30" class="card-title">🐳 HARD DRILL: MULTI-CONTAINER DATAOPS (COMPOSE)</text>
    <text x="25" y="46" class="card-subtitle">Isolated Bridge Network • Healthchecks • Host Persistence</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#0ea5e9">Virtual Network &amp; Internal DNS</text>
      <text x="12" y="42" class="subtitle" font-size="11">Zero localhost • Bridge Virtual Switch</text>
      <text x="12" y="60" class="code-text">host: postgres_db:5432</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">PostgreSQL 16 Alpine + Python 3.12</text>
    </g>

    <g transform="translate(275, 60)">
      <rect width="235" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" class="item-text" font-weight="700" fill="#10b981">Resilience &amp; Bind Mounts</text>
      <text x="12" y="42" class="subtitle" font-size="11">condition: service_healthy (pg_isready)</text>
      <text x="12" y="60" class="code-text">./data/output:/app/data/output</text>
      <text x="12" y="80" class="subtitle" font-size="10" fill="#94a3b8">Zero race conditions • Output saved to Windows</text>
    </g>
  </g>

</svg>
